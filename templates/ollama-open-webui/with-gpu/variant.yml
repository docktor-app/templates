name: With NVIDIA GPU
description: Ollama with access to all NVIDIA GPUs via a device reservation, plus Open WebUI
usage: |
  Requires an NVIDIA GPU, the proprietary NVIDIA driver and the NVIDIA
  Container Toolkit on the Docker host (Linux, or Docker Desktop with WSL2).
  Verify with: docker run --rm --gpus all ubuntu nvidia-smi
  If the toolkit is missing, the ollama container will fail to start.

  Set WEBUI_SECRET_KEY in .env to a long random string before the first
  start. Open the WebUI port in your browser; the first account you create
  becomes the admin - there are no default credentials.

  No models are installed yet. Download one from the WebUI (Admin Panel ->
  Settings -> Models) or from the host, for example:
    docker compose exec ollama ollama pull llama3.2
  Check GPU use with: docker compose exec ollama ollama ps

  Models are stored in ./volumes/ollama and can be several GB each. The
  Ollama API is also published (OLLAMA_PORT, default 11434) and has no
  authentication - restrict it to a trusted network.
