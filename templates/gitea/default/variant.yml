name: Default
description: Gitea with SQLite, a single container, good for personal use and small teams
usage: |
  Open the web port in your browser. The installer is skipped; the first
  account you register becomes the administrator.

  Git over SSH is published on the SSH port from .env (default 2222), so
  clone URLs look like ssh://git@<host>:2222/<user>/<repo>.git. Set
  GITEA_DOMAIN and GITEA_ROOT_URL to the address users will actually use,
  otherwise clone links and webhooks point at localhost.

  Everything (repositories, SQLite database, config) lives in ./volumes/data.
  Use the with-postgres variant for larger installations.
