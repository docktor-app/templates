services:
  linkding:
    image: sissbruecker/linkding:1.47.0
    restart: unless-stopped
    ports:
      - "${LINKDING_PORT}:9090"
    environment:
      - LD_SUPERUSER_NAME=${LD_SUPERUSER_NAME}
      - LD_SUPERUSER_PASSWORD=${LD_SUPERUSER_PASSWORD}
    env_file: .env
    volumes:
      - ./volumes/data:/etc/linkding/data
