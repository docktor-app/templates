services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.28.0
    restart: unless-stopped
    ports:
      - "${MEALIE_PORT}:9000"
    environment:
      - BASE_URL=${BASE_URL}
      - TZ=${TZ}
      - ALLOW_SIGNUP=${ALLOW_SIGNUP}
    env_file: .env
    deploy:
      resources:
        limits:
          memory: 1000M
    volumes:
      - ./volumes/data:/app/data
