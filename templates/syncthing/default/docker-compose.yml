services:
  syncthing:
    image: syncthing/syncthing:2.1.6
    hostname: syncthing
    restart: unless-stopped
    ports:
      - "${SYNCTHING_GUI_PORT}:8384"
      - "${SYNCTHING_SYNC_PORT}:22000/tcp"
      - "${SYNCTHING_SYNC_PORT}:22000/udp"
      - "${SYNCTHING_DISCOVERY_PORT}:21027/udp"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    env_file: .env
    volumes:
      - ./volumes/config:/var/syncthing/config
      - ./volumes/data:/var/syncthing/Sync
    healthcheck:
      test: ["CMD-SHELL", "curl -fkLsS -m 2 127.0.0.1:8384/rest/noauth/health | grep -o --color=never OK || exit 1"]
      interval: 1m
      timeout: 10s
      retries: 3
