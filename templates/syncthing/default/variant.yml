name: Default
description: Syncthing with a web GUI, sync protocol and local discovery ports
usage: |
  Open the GUI port in your browser. The GUI is unprotected on first start:
  immediately set a GUI username and password under Actions -> Settings ->
  GUI, otherwise anyone on your network can control Syncthing.

  Synced folders live in ./volumes/data (mounted at /var/syncthing/Sync in
  the container; use that path when adding folders). Configuration and the
  device identity are in ./volumes/config. PUID/PGID in .env set the file
  owner of synced files.

  Port 22000 (TCP/UDP) is the sync protocol; 21027/udp is local network
  discovery. To pair with devices outside your LAN, forward the sync port
  on your router or rely on Syncthing's relay servers.
