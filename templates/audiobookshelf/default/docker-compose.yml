services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.37.1
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${AUDIOBOOKSHELF_PORT:-13378}:80"
    environment:
      - TZ=${TZ:-Etc/UTC}
    env_file: .env
    volumes:
      - ./volumes/audiobooks:/audiobooks
      - ./volumes/podcasts:/podcasts
      - ./volumes/config:/config
      - ./volumes/metadata:/metadata
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
