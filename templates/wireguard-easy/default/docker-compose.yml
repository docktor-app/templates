services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15.4.0
    restart: unless-stopped
    ports:
      - "${WG_PORT}:51820/udp"
      - "${WG_UI_PORT}:51821/tcp"
    environment:
      - INIT_ENABLED=true
      - INIT_USERNAME=${WG_ADMIN_USER}
      - INIT_PASSWORD=${WG_ADMIN_PASSWORD}
      - INIT_HOST=${WG_HOST}
      - INIT_PORT=${WG_PORT}
      - INSECURE=${WG_INSECURE}
    env_file: .env
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - ./volumes/wireguard:/etc/wireguard
