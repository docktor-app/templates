services:
  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:2.14.2
    restart: unless-stopped
    ports:
      - "${Z2M_PORT}:8080"
    environment:
      - TZ=${TZ}
      - ZIGBEE2MQTT_CONFIG_MQTT_SERVER=${MQTT_SERVER}
    env_file: .env
    devices:
      - ${ZIGBEE_DEVICE}:/dev/ttyACM0
    volumes:
      - ./volumes/data:/app/data
      - ./configuration.yaml:/app/data/configuration.yaml
