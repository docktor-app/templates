services:
  app:
    image: nextcloud:35-apache
    restart: unless-stopped
    ports:
      - "${NEXTCLOUD_PORT:-8080}:80"
    env_file: .env
    volumes:
      - ./volumes/html:/var/www/html

  cron:
    image: nextcloud:35-apache
    restart: unless-stopped
    entrypoint: /cron.sh
    env_file: .env
    volumes:
      - ./volumes/html:/var/www/html
    depends_on:
      - app
