name: Behind a Reverse Proxy
description: Full stack without a published port — served through an existing Traefik instance
usage: |
  Same services as the default variant (app, cron, PostgreSQL, Redis), but
  nothing is published on the host. Nextcloud attaches to an external Docker
  network named "proxy" and is routed by Traefik labels (HTTPS via the
  "letsencrypt" cert resolver, CalDAV/CardDAV redirects and HSTS included).
  Adapt the labels if you use a different proxy.

  Before deploying:
    1. Set NEXTCLOUD_DOMAIN in .env to the hostname you serve Nextcloud on.
    2. Create the shared network once, if it does not exist yet:
       docker network create proxy
    3. Attach your reverse proxy to that same network.
    4. Set TRUSTED_PROXIES in .env to the proxy network's subnet or the
       proxy's IP (see: docker network inspect proxy), so Nextcloud sees
       real client IPs.

  After the first start finishes installing, open https://<NEXTCLOUD_DOMAIN>
  and log in with NEXTCLOUD_ADMIN_USER / NEXTCLOUD_ADMIN_PASSWORD. Then set
  Administration settings > Basic settings > Background jobs to "Cron".
