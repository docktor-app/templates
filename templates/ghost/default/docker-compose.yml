services:
  ghost:
    image: ghost:6.69.0
    restart: unless-stopped
    ports:
      - "${GHOST_PORT}:2368"
    environment:
      - url=${GHOST_URL}
      - NODE_ENV=development
      - database__client=sqlite3
      - database__connection__filename=/var/lib/ghost/content/data/ghost.db
    env_file: .env
    volumes:
      - ./volumes/content:/var/lib/ghost/content
