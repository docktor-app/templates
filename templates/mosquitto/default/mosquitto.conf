# Mosquitto 2.x configuration (mounted into the container)

listener 1883
protocol mqtt

persistence true
persistence_location /mosquitto/data/

log_dest stdout

# Anonymous access is enabled so the broker works out of the box.
# To require logins, set allow_anonymous to false and uncomment password_file
# (see the usage notes on how to create the password file).
allow_anonymous true
#password_file /mosquitto/config/passwd
