services:
  stirling-pdf:
    image: ghcr.io/stirling-tools/stirling-pdf:3.1.0
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file: .env
    environment:
      - SECURITY_ENABLELOGIN=${SECURITY_ENABLELOGIN:-true}
      - SECURITY_INITIALLOGIN_USERNAME=${SECURITY_INITIALLOGIN_USERNAME}
      - SECURITY_INITIALLOGIN_PASSWORD=${SECURITY_INITIALLOGIN_PASSWORD}
      - SYSTEM_DEFAULTLOCALE=${SYSTEM_DEFAULTLOCALE:-en-US}
    volumes:
      - ./volumes/configs:/configs
      - ./volumes/logs:/logs
      - ./volumes/customFiles:/customFiles
      - ./volumes/pipeline:/pipeline
      - ./volumes/storage:/storage
      - ./volumes/tessdata:/usr/share/tessdata
