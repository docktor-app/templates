services:
  jellyfin:
    image: jellyfin/jellyfin:12.2
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${JELLYFIN_PORT:-8096}:8096"
      - "${JELLYFIN_DISCOVERY_PORT:-7359}:7359/udp"
    environment:
      - TZ=${TZ:-Etc/UTC}
    env_file: .env
    volumes:
      - ./volumes/config:/config
      - ./volumes/cache:/cache
      - ./volumes/media:/media
