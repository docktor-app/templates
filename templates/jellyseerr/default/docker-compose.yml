services:
  jellyseerr:
    image: ghcr.io/seerr-team/seerr:v3.5.0
    restart: unless-stopped
    init: true
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${JELLYSEERR_PORT:-5055}:5055"
    environment:
      - TZ=${TZ:-Etc/UTC}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    env_file: .env
    volumes:
      - ./volumes/config:/app/config
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
