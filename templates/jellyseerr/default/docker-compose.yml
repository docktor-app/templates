services:
  jellyseerr:
    image: ghcr.io/seerr-team/seerr:v3.5.0
    restart: unless-stopped
    init: true
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${JELLYSEERR_PORT:-5055}:5055"
    environment:
      - TZ=${TZ:-Etc/UTC}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    env_file: .env
    volumes:
      - ./volumes/config:/app/config
