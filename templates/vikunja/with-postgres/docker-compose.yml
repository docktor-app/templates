services:
  vikunja:
    image: vikunja/vikunja:2.7.0
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3456}:3456"
    env_file: .env
    environment:
      - VIKUNJA_SERVICE_PUBLICURL=${VIKUNJA_SERVICE_PUBLICURL}
      - VIKUNJA_SERVICE_SECRET=${VIKUNJA_SERVICE_SECRET}
      - VIKUNJA_SERVICE_ENABLEREGISTRATION=${VIKUNJA_SERVICE_ENABLEREGISTRATION:-true}
      - VIKUNJA_DATABASE_USER=${DB_USERNAME}
      - VIKUNJA_DATABASE_PASSWORD=${DB_PASSWORD}
      - VIKUNJA_DATABASE_DATABASE=${DB_DATABASE_NAME}
    volumes:
      - ./volumes/files:/app/vikunja/files
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_DATABASE_NAME}
    env_file: .env
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
