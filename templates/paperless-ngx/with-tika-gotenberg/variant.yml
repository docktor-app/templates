name: With Tika and Gotenberg
description: Adds Apache Tika and Gotenberg so Paperless-ngx can import Office documents and emails
usage: |
  Same as the default variant, plus Apache Tika and Gotenberg containers
  that let Paperless-ngx parse and convert Office documents (docx, xlsx,
  pptx, odt, ...) and email files (eml).

  Open the published port in your browser and log in with the admin
  credentials from .env (PAPERLESS_ADMIN_USER / PAPERLESS_ADMIN_PASSWORD).
  They are only used to create the account on the very first start; change
  the password in the UI afterwards.

  Drop files into ./volumes/consume to have them imported automatically.

  Change DB_PASSWORD and PAPERLESS_SECRET_KEY (a long random string) before
  the first start, and set PAPERLESS_URL to the public URL if you use a
  reverse proxy. Tika and Gotenberg are only reachable inside the stack.
