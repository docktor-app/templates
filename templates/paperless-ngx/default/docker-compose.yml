services:
  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.3.1
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file: .env
    environment:
      - PAPERLESS_DBNAME=${DB_DATABASE_NAME}
      - PAPERLESS_DBUSER=${DB_USERNAME}
      - PAPERLESS_DBPASS=${DB_PASSWORD}
    volumes:
      - ./volumes/data:/usr/src/paperless/data
      - ./volumes/media:/usr/src/paperless/media
      - ./volumes/export:/usr/src/paperless/export
      - ./volumes/consume:/usr/src/paperless/consume
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy

  broker:
    image: redis:8.8.3
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    configs:
      - source: redis-conf
        target: /usr/local/etc/redis/redis.conf
    volumes:
      - ./volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_DATABASE_NAME}
    env_file: .env
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

configs:
  redis-conf:
    content: |
      save 60 1
      loglevel notice
