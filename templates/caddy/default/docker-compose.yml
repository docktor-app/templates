services:
  caddy:
    image: caddy:2.11.7
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT}:80"
      - "${CADDY_HTTPS_PORT}:443"
      - "${CADDY_HTTPS_PORT}:443/udp"
    env_file: .env
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - ./volumes/data:/data
      - ./volumes/config:/config

configs:
  caddyfile:
    content: |
      ${CADDY_DOMAIN} {
      	reverse_proxy ${CADDY_UPSTREAM}
      }
