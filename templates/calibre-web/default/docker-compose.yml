services:
  calibre-web:
    image: lscr.io/linuxserver/calibre-web:0.6.27
    restart: unless-stopped
    ports:
      - "${CALIBRE_WEB_PORT:-8083}:8083"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    env_file: .env
    volumes:
      - ./volumes/config:/config
      - ./volumes/books:/books
