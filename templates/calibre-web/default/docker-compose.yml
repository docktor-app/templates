services:
  calibre-web:
    image: lscr.io/linuxserver/calibre-web:0.6.27
    restart: unless-stopped
    ports:
      - "${CALIBRE_WEB_PORT:-8083}:8083"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    env_file: .env
    volumes:
      - ./volumes/config:/config
      - ./volumes/books:/books
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8083/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
