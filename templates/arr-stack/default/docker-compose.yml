services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20
    restart: unless-stopped
    ports:
      - "${SONARR_PORT:-8989}:8989"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    env_file: .env
    volumes:
      - ./volumes/config/sonarr:/config
      - ./volumes/data:/data

  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4
    restart: unless-stopped
    ports:
      - "${RADARR_PORT:-7878}:7878"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    env_file: .env
    volumes:
      - ./volumes/config/radarr:/config
      - ./volumes/data:/data

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.6.5
    restart: unless-stopped
    ports:
      - "${PROWLARR_PORT:-9696}:9696"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    env_file: .env
    volumes:
      - ./volumes/config/prowlarr:/config

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.4
    restart: unless-stopped
    ports:
      - "${QBITTORRENT_WEBUI_PORT:-8080}:8080"
      - "${QBITTORRENT_TORRENT_PORT:-6881}:6881"
      - "${QBITTORRENT_TORRENT_PORT:-6881}:6881/udp"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - WEBUI_PORT=8080
      - TORRENTING_PORT=${QBITTORRENT_TORRENT_PORT:-6881}
    env_file: .env
    volumes:
      - ./volumes/config/qbittorrent:/config
      - ./volumes/data/torrents:/data/torrents
