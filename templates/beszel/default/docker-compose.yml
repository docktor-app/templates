services:
  beszel:
    image: henrygd/beszel:0.21.0
    restart: unless-stopped
    ports:
      - "${BESZEL_PORT}:8090"
    environment:
      - APP_URL=${BESZEL_APP_URL}
    env_file: .env
    volumes:
      - ./volumes/data:/beszel_data
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
