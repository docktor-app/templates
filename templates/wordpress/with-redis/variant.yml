name: With Redis
description: Adds a Redis container for the WordPress persistent object cache
usage: |
  Before deploying, replace the database passwords in .env. Generate strong
  values with:
    openssl rand -hex 24

  Open the published port in your browser and complete the WordPress
  install wizard.

  The redis service is reachable from WordPress as host "redis" (port 6379)
  and WP_REDIS_HOST is already defined for you. To actually use it, install
  and activate the "Redis Object Cache" plugin from Plugins > Add New, then
  click "Enable Object Cache" in Settings > Redis.

  The database passwords are only applied the first time MariaDB
  initialises ./volumes/db.
